{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <title>{% block title %}Registeration {% endblock title %}</title>

    <link rel="icon" href="{% static 'img/logo-icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class = 'loginpage'>
    {% include "pages/msg.html" %}
    
    <div class="login-container">

        <form action="#" ,class="registration-form" method= "POST">
            {% csrf_token %}
            <h2>Registration Form</h2>
            <p>Please enter your details to sign up</p>
            
            <div class="input-group">
                <label for="username">Name</label>
                <input type="text" id="username" name= "username" placeholder="Enter your name" >
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" >
            </div>
            {% comment %} <div class="input-group">
                <label for="mobile">Mobile No.</label>
                <input type="mobile" id="mobile" name="mobile" placeholder="Enter your mobile no. " required>
            </div> {% endcomment %}
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            {% comment %} <div class="input-group">
                <label for="password">Re-enter Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div> {% endcomment %}
            
            
            
            <button type="submit" class="register-btn">Register</button>
            
        </form>
    </div>
</body>
</html>
