{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %} Login Page {% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class ="loginpage">
    {% include "pages/msg.html" %}
    <div class="login-container">
        <form class="login-form" method="POST">
            {% csrf_token %}
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in</p>
            
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name = "username" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="{% url 'forget_pass_page' %}" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">Log In</button>
            
            <p class="signup-redirect">
                Don't have an account? <a href="{% url 'register_page' %}">Sign up</a>
            </p>
        </form>
    </div>
</body>
</html>
